apply plugin: 'com.android.library'
// Runs codegen for src/NativeRNNordicDfu.ts (see codegenConfig in package.json).
apply plugin: 'com.facebook.react'

def safeExtGet(prop, fallback) {
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

android {
    namespace 'com.pilloxa.dfu'

    // The Android Gradle Plugin, SDK levels and React Native version all come
    // from the app; the fallbacks are only used if the app does not set them.
    compileSdkVersion safeExtGet('compileSdkVersion', 35)

    defaultConfig {
        minSdkVersion safeExtGet('minSdkVersion', 24)
        targetSdkVersion safeExtGet('targetSdkVersion', 35)
    }

    lint {
        abortOnError false
    }
}

repositories {
    mavenCentral()
    google()
}

dependencies {
    implementation 'com.facebook.react:react-android'
    // Override with `ext.nordicDfuVersion` in the app's root build.gradle.
    // 2.10+ pull in kotlin-stdlib 2.2+/2.3+, which needs a newer Kotlin than
    // React Native 0.80 ships with.
    implementation "no.nordicsemi.android:dfu:${safeExtGet('nordicDfuVersion', '2.9.0')}"
}
